<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243b53">
<title>위치 기록</title>
<style>
:root{
  --ink:#1f2933; --sub:#616e7c; --line:#d9dee3; --bg:#ffffff; --soft:#f3f5f7;
  --navy:#243b53; --navy-d:#18283a; --amber:#b7791f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;color:var(--ink);overscroll-behavior:none;background:#e5e9ed}
#map{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;background:#e5e9ed}
#mapstate{position:fixed;z-index:1;left:0;right:0;top:38%;text-align:center;font-size:14px;color:var(--sub);pointer-events:none;padding:0 24px}

#top{position:fixed;z-index:500;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#top h1{margin:0 4px 0 0;font-size:15px;font-weight:700;letter-spacing:-.01em;background:var(--navy);color:#fff;padding:7px 12px;border-radius:8px}
.chip{font-size:12.5px;font-weight:600;background:var(--bg);padding:7px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(31,41,51,.2);font-variant-numeric:tabular-nums}
#mode{display:none;color:var(--amber)}

#banner{position:fixed;z-index:700;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 54px);background:#fff8e6;border:1px solid #e8cf94;color:#5c4510;padding:9px 12px;border-radius:8px;font-size:13px;display:none;max-width:560px}

#sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:0 -4px 20px rgba(31,41,51,.18);padding:0 14px calc(env(safe-area-inset-bottom,0px) + 10px);max-width:640px;margin:0 auto}
#grip{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;border:0;background:transparent;padding:9px 0 8px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--sub)}
#grip .pill{width:38px;height:4px;border-radius:2px;background:#c3cad1}
#sheetBody{overflow-x:hidden;overflow-y:auto;max-height:82vh;transition:max-height .28s ease,opacity .2s ease}
#sheet.min #sheetBody{max-height:0;opacity:0;visibility:hidden;transition:max-height .28s ease,opacity .2s ease,visibility 0s .28s}
#tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#tags::-webkit-scrollbar{display:none}
#tags button{flex:0 0 auto;display:flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--sub);background:var(--soft);border:1px solid transparent;border-radius:8px;padding:7px 11px;cursor:pointer}
#tags button i{width:9px;height:9px;border-radius:50%;display:block}
#tags button.on{color:var(--ink);background:#fff;border-color:var(--navy)}
#note{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;margin:0 0 10px;font-family:inherit;color:var(--ink);background:#fff}
#note:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
#stamp{width:100%;border:0;border-radius:10px;background:var(--navy);color:#fff;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;padding:15px 0;cursor:pointer;transition:background .12s,transform .08s}
#stamp:hover{background:var(--navy-d)}
#stamp:active{transform:scale(.99);background:var(--navy-d)}
#stamp.busy{opacity:.7;pointer-events:none}

#bar{margin-top:6px}
.row{display:flex;gap:6px;margin-top:8px;align-items:center}
.row .tilde{color:var(--sub);font-size:13px}
#bar button,#bar input{font-family:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
#bar button{flex:1}
#bar button.p{background:var(--navy);border-color:var(--navy);color:#fff}
#bar button.on{background:var(--soft);border-color:var(--navy)}
#bar input{flex:1;min-width:0;cursor:text}
#bar .row input{padding:8px 6px;font-size:14px}
#bar select{flex:0 0 96px;font-family:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 6px}
#bar #aCustom{flex:0 0 66px;text-align:center}
#autoNote{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.45}
#aBtn.on{background:#fdf3e1;border-color:var(--amber);color:#7a4f10}

#list{margin:8px 0 0;padding:0;list-style:none;max-height:0;overflow:auto;transition:max-height .25s ease}
#sheet.open #list{max-height:32vh}
#list li{display:flex;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
#list .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
#list .tx{flex:1;min-width:0}
#list .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .tx span{font-size:12px;color:var(--sub)}
#empty{display:none;text-align:center;font-size:13.5px;color:var(--sub);padding:12px 0 2px}

.pin{width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(31,41,51,.5)}
.pin.last{width:34px;height:34px;font-size:14px;box-shadow:0 0 0 3px rgba(36,59,83,.35),0 1px 5px rgba(31,41,51,.5)}
.me{width:16px;height:16px;border-radius:50%;background:#2b6cb0;border:3px solid #fff;box-shadow:0 0 0 0 rgba(43,108,176,.5);animation:ping 1.8s infinite}
@keyframes ping{to{box-shadow:0 0 0 20px rgba(43,108,176,0)}}
.leaflet-popup-content{font-family:inherit;margin:12px 14px}
.pop b{font-size:14.5px}
.pop div{font-size:12px;color:var(--sub);margin-top:3px}
.pop button{margin-top:9px;border:1px solid var(--line);background:#fff;color:#9b2c2c;font-weight:600;border-radius:6px;padding:5px 10px;font-family:inherit;font-size:12.5px;cursor:pointer}

#login{position:fixed;z-index:1000;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(24,40,58,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#login form{width:100%;max-width:340px;background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#login h2{margin:0 0 4px;font-size:18px}
#login p{margin:0 0 14px;font-size:13px;color:var(--sub)}
#login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px;font-family:inherit;margin-bottom:8px;color:var(--ink)}
#login input:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
#login button{width:100%;border:0;border-radius:10px;background:var(--navy);color:#fff;font-family:inherit;font-size:16px;font-weight:700;padding:13px 0;cursor:pointer;margin-top:4px}
#login button:disabled{opacity:.6}
#loginErr{color:#9b2c2c;font-size:13px;min-height:18px;margin-top:6px}
#logout{display:none;pointer-events:auto;border:0;font-family:inherit;cursor:pointer;color:var(--sub)}
#toast{position:fixed;z-index:900;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.leaflet-top{top:env(safe-area-inset-top,0px)}
#locate{position:fixed;z-index:550;right:10px;top:calc(env(safe-area-inset-top,0px) + 84px);width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 5px rgba(31,41,51,.3);padding:0}
#locate:active{background:var(--soft)}
#locate.busy{opacity:.55;pointer-events:none}
#locate svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.me{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="mapstate">지도를 불러오는 중…</div>

<div id="top">
  <h1>위치 기록</h1>
  <span class="chip" id="cCount">0건</span>
  <span class="chip" id="cDist">0 km</span>
  <span class="chip" id="mode">로컬 저장</span>
  <button class="chip" id="logout">로그아웃</button>
  <span class="chip" id="cAuto" style="display:none"></span>
</div>
<div id="banner"></div>
<button id="locate" aria-label="내 위치 찾기" title="내 위치 찾기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>
</button>

<div id="sheet">
  <button id="grip" aria-expanded="true"><span class="pill"></span><span id="gripTxt">입력창 내리기 ▼</span></button>
  <div id="sheetBody">
  <div id="tags"></div>
  <input id="note" type="text" maxlength="60" placeholder="메모 (선택)">
  <button id="stamp">현재 위치 기록</button>

  <div id="bar">
    <div class="row">
      <button id="bList">목록 보기</button>
      <button id="bPlay" class="p">경로 재생</button>
    </div>
    <div class="row">
      <select id="aInt" aria-label="자동 기록 간격">
        <option value="1">1분</option><option value="3">3분</option><option value="5">5분</option>
        <option value="10">10분</option><option value="15">15분</option><option value="30">30분</option>
        <option value="60">1시간</option><option value="custom">직접 입력</option>
      </select>
      <input id="aCustom" type="number" min="1" max="720" inputmode="numeric" placeholder="분">
      <button id="aBtn">자동 기록 시작</button>
    </div>
    <div id="autoNote">자동 기록은 이 화면이 켜져 있는 동안에만 동작합니다. 이전 위치와 거의 같으면 저장하지 않습니다.</div>
    <div class="row">
      <input id="dFrom" type="date" aria-label="시작일">
      <span class="tilde">~</span>
      <input id="dTo" type="date" aria-label="종료일">
    </div>
    <div class="row" id="presets">
      <button data-d="0">오늘</button>
      <button data-d="6">최근 7일</button>
      <button data-d="29">최근 30일</button>
      <button data-d="all">전체 기간</button>
    </div>
  </div>
  <ul id="list"></ul>
  <div id="empty">기록이 없습니다. 위 버튼을 눌러 현재 위치를 기록하세요.</div>
  </div>
</div>

<div id="login">
  <form id="loginForm">
    <h2>로그인</h2>
    <p>비밀번호를 입력하세요.</p>
    <input id="lUser" type="email" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <input id="lPw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button id="lBtn" type="submit">들어가기</button>
    <div id="loginErr"></div>
  </form>
</div>

<div id="toast"></div>

<script>
window.addEventListener("error", function (e) {
  if (e.target && e.target !== window) return; /* 이미지·스크립트 로딩 실패는 무시 (다른 서버로 자동 재시도) */
  var b = document.getElementById("banner"); if (!b) return;
  b.textContent = "오류: " + (e.message || e.type) + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
  b.style.display = "block";
});
window.addEventListener("unhandledrejection", function (e) {
  var b = document.getElementById("banner"); if (!b) return;
  b.textContent = "오류: " + ((e.reason && (e.reason.message || e.reason)) || "알 수 없음"); b.style.display = "block";
});
</script>
<script>
(async () => {
/* ========================================================
   Firebase 콘솔의 설정값을 아래에 붙여넣으세요.
   (프로젝트 설정 → 일반 → 내 앱 → 웹 앱 → SDK 설정 및 구성)
   값을 넣지 않으면 이 기기 브라우저에만 저장됩니다.
   ======================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDPJkZqRWmvNSir18ALy5QJHxBjdA971tk",
  authDomain: "imhere-bc295.firebaseapp.com",
  projectId: "imhere-bc295",
  storageBucket: "imhere-bc295.firebasestorage.app",
  messagingSenderId: "343663838782",
  appId: "1:343663838782:web:ca4f0f42e6273f2470736f"
};
/* ======================================================== */

/* 로그인용 계정 이메일 (Firebase 콘솔에서 이 이메일로 사용자를 만들고, 앱에서는 비밀번호만 입력합니다).
   실제 존재하는 주소일 필요는 없습니다. */
const OWNER_EMAIL = "owner@imhere.app";
const COLLECTION = "footprints";
const TAGS = [
  { name: "일반", color: "#334e68" },
  { name: "업무", color: "#5b4b8a" },
  { name: "식사", color: "#8a6d3b" }
];
const tagColor = n => (TAGS.find(t => t.name === n) || TAGS[0]).color;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

function banner(msg) { const b = $("banner"); b.textContent = msg; b.style.display = "block"; }
let tt;
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- 1. 지도를 가장 먼저 만든다 (Firebase와 무관하게 표시) ---------- */
function loadCSS(href) {
  return new Promise(res => {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href;
    l.onload = () => res(true); l.onerror = () => res(false);
    document.head.appendChild(l); setTimeout(() => res(false), 6000);
  });
}
function loadJS(src) {
  return new Promise(res => {
    const sc = document.createElement("script"); sc.src = src;
    sc.onload = () => res(true); sc.onerror = () => res(false);
    document.head.appendChild(sc); setTimeout(() => res(false), 8000);
  });
}
const CDNS = [
  ["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css", "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"],
  ["https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css", "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"],
  ["https://unpkg.com/leaflet@1.9.4/dist/leaflet.css", "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"]
];
for (const [css, js] of CDNS) {
  if (typeof L !== "undefined") break;
  await loadCSS(css);
  await loadJS(js);
}
if (typeof L === "undefined") {
  banner("지도 라이브러리를 불러오지 못했습니다. 네트워크 연결이나 차단 설정을 확인한 뒤 새로고침하세요.");
  throw new Error("Leaflet not loaded");
}
const map = L.map("map", { zoomControl: false }).setView([37.5665, 126.978], 12);
L.control.zoom({ position: "topright" }).addTo(map);

/* 지도 타일: OpenStreetMap(키 불필요) 우선, 실패 시 Esri로 자동 전환.
   (CARTO 지도는 2026년 8월부터 API 키가 없으면 "API KEY REQUIRED" 워터마크가 찍혀서 사용하지 않습니다.) */
const tileA = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const osm = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles &copy; Esri"
});
let tileErrors = 0, tileOk = 0, switched = false, osmErrors = 0;
osm.on("tileerror", () => { if (++osmErrors === 4) banner("지도 이미지를 불러오지 못했습니다. 이 브라우저나 네트워크에서 지도 서버 접속이 막혀 있을 수 있습니다."); });
tileA.on("tileload", () => { tileOk++; $("mapstate").style.display = "none"; });
osm.on("tileload", () => { $("mapstate").style.display = "none"; });
tileA.on("tileerror", () => {
  if (++tileErrors >= 4 && tileOk === 0 && !switched) {
    switched = true; map.removeLayer(tileA); osm.addTo(map);
  }
});
setTimeout(() => { if (tileOk === 0 && !switched) $("mapstate").textContent = "지도 이미지 로딩이 지연되고 있습니다…"; }, 8000);
if (getComputedStyle(document.querySelector(".leaflet-pane")).position !== "absolute") {
  banner("지도 스타일 파일을 불러오지 못했습니다. 새로고침하거나 다른 브라우저에서 열어 보세요.");
}
setTimeout(() => map.invalidateSize(), 300);
window.addEventListener("resize", () => map.invalidateSize());

const layer = L.layerGroup().addTo(map);
let meMarker = null, meCircle = null;
function setMe(lat, lng, acc) {
  const ll = [lat, lng], r = Math.max(acc || 0, 5);
  if (meMarker) meMarker.setLatLng(ll);
  else meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false, zIndexOffset: -100 }).addTo(map);
  if (meCircle) meCircle.setLatLng(ll).setRadius(r);
  else meCircle = L.circle(ll, { radius: r, color: "#2b6cb0", weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
}

/* ---------- 2. 저장소 (Firebase 실패 시 로컬로 자동 전환) ---------- */
function localStore() {
  $("mode").style.display = "inline-block";
  const KEY = "location-log-local";
  const listeners = [];
  const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const save = a => { localStorage.setItem(KEY, JSON.stringify(a)); listeners.forEach(f => f(a)); };
  return {
    add: async r => save([...load(), { id: Date.now() + Math.random().toString(36).slice(2, 6), ...r }]),
    remove: async id => save(load().filter(x => x.id !== id)),
    watch: cb => { listeners.push(cb); cb(load()); }
  };
}

function showLogin(on) {
  $("login").style.display = on ? "flex" : "none";
  $("logout").style.display = on ? "none" : "inline-block";
}

async function firebaseStore() {
  const V = "10.14.1", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, fs, au] = await Promise.all([
    import(base + "firebase-app.js"),
    import(base + "firebase-firestore.js"),
    import(base + "firebase-auth.js")
  ]);
  const app = initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  const auth = au.getAuth(app);
  return {
    add: r => fs.addDoc(fs.collection(db, COLLECTION), r),
    remove: id => fs.deleteDoc(fs.doc(db, COLLECTION, id)),
    login: pw => au.signInWithEmailAndPassword(auth, OWNER_EMAIL, pw),
    logout: () => au.signOut(auth),
    watch: cb => {
      let unsub = null;
      au.onAuthStateChanged(auth, user => {
        if (unsub) { unsub(); unsub = null; }
        if (!user || user.isAnonymous) { if (user) au.signOut(auth); cb([]); showLogin(true); return; } /* 예전 익명 세션은 로그아웃 처리 */
        showLogin(false);
        $("banner").style.display = "none";
        unsub = fs.onSnapshot(fs.query(fs.collection(db, COLLECTION), fs.orderBy("t")),
          snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
          err => banner(err.code === "permission-denied" ? "접근 권한이 없습니다. Firestore 규칙의 이메일이 OWNER_EMAIL과 같은지 확인하세요." : "데이터를 불러오지 못했습니다: " + err.code));
      });
    }
  };
}

let store;
if (firebaseConfig.apiKey.startsWith("YOUR")) {
  store = localStore();
} else {
  try { store = await firebaseStore(); }
  catch (e) {
    banner("Firebase에 연결하지 못해 로컬 저장으로 전환했습니다. (" + (e.message || e) + ")");
    store = localStore();
  }
}

/* ---------- 상태 ---------- */
let recs = [];
let filterFrom = null, filterTo = null;
let tag = TAGS[0].name;
let firstFit = true;
let playing = false;
const markerById = new Map();

const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmt = t => new Date(t).toLocaleString("ko-KR", { month: "long", day: "numeric", weekday: "short", hour: "numeric", minute: "2-digit" });
const km = (a, b) => {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

/* ---------- 분류 선택 ---------- */
TAGS.forEach((t, i) => {
  const b = document.createElement("button");
  const dot = document.createElement("i"); dot.style.background = t.color;
  b.append(dot, document.createTextNode(t.name));
  if (i === 0) b.classList.add("on");
  b.onclick = () => { tag = t.name; [...$("tags").children].forEach(x => x.classList.toggle("on", x === b)); };
  $("tags").appendChild(b);
});

/* ---------- 렌더링 ---------- */
const visible = () => recs.filter(r => {
  const d = dayKey(r.t);
  return (!filterFrom || d >= filterFrom) && (!filterTo || d <= filterTo);
}).sort((a, b) => a.t - b.t);

function render(fit) {
  layer.clearLayers(); markerById.clear();
  const vis = visible();

  if (vis.length > 1) {
    L.polyline(vis.map(r => [r.lat, r.lng]), { color: "#243b53", weight: 3, opacity: .55, dashArray: "1 8", lineCap: "round" }).addTo(layer);
  }

  vis.forEach((r, i) => {
    const last = i === vis.length - 1, size = last ? 34 : 28;
    const icon = L.divIcon({
      className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2],
      html: `<div class="pin${last ? " last" : ""}" style="background:${tagColor(r.tag)}">${i + 1}</div>`
    });
    const m = L.marker([r.lat, r.lng], { icon }).addTo(layer);
    m.bindPopup(() => {
      const box = document.createElement("div"); box.className = "pop";
      const b = document.createElement("b"); b.textContent = r.note || "기록 " + (i + 1);
      const d = document.createElement("div"); d.textContent = fmt(r.t) + " · " + (r.tag || "일반");
      const btn = document.createElement("button"); btn.textContent = "삭제";
      btn.onclick = async () => {
        if (!confirm("이 기록을 삭제할까요?")) return;
        try { await store.remove(r.id); map.closePopup(); toast("삭제했습니다"); }
        catch (e) { toast("삭제 실패: " + (e.code || e.message)); }
      };
      box.append(b, d, btn);
      return box;
    });
    markerById.set(r.id, m);
  });

  let dist = 0;
  for (let i = 1; i < vis.length; i++) dist += km(vis[i - 1], vis[i]);
  $("cCount").textContent = vis.length + "건";
  $("cDist").textContent = (dist < 10 ? dist.toFixed(1) : Math.round(dist)) + " km";

  const ul = $("list"); ul.innerHTML = "";
  vis.map((r, i) => ({ r, i })).reverse().forEach(({ r, i }) => {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1; n.style.background = tagColor(r.tag);
    const tx = document.createElement("div"); tx.className = "tx";
    const b = document.createElement("b"); b.textContent = r.note || "기록 " + (i + 1);
    const s = document.createElement("span"); s.textContent = fmt(r.t) + " · " + (r.tag || "일반");
    tx.append(b, s); li.append(n, tx);
    li.onclick = () => { map.flyTo([r.lat, r.lng], 17, { duration: .8 }); setTimeout(() => markerById.get(r.id)?.openPopup(), 850); };
    ul.appendChild(li);
  });
  $("empty").style.display = vis.length ? "none" : "block";

  if (fit && vis.length) fitAll(vis);
}

function fitAll(vis = visible()) {
  if (!vis.length) return;
  if (vis.length === 1) map.setView([vis[0].lat, vis[0].lng], 16);
  else map.fitBounds(L.latLngBounds(vis.map(r => [r.lat, r.lng])), { paddingTopLeft: [50, 60], paddingBottomRight: [50, ($("sheet").offsetHeight || 300) + 24] });
}

/* ---------- 기록 ---------- */
$("stamp").addEventListener("click", () => {
  if (!navigator.geolocation) return toast("이 브라우저는 위치 기능을 지원하지 않습니다");
  if (!window.isSecureContext) return toast("위치 기능은 https 주소에서만 사용할 수 있습니다");
  const btn = $("stamp");
  btn.classList.add("busy"); btn.textContent = "위치 확인 중…";
  const done = () => { btn.classList.remove("busy"); btn.textContent = "현재 위치 기록"; };

  navigator.geolocation.getCurrentPosition(async pos => {
    const rec = {
      lat: pos.coords.latitude, lng: pos.coords.longitude,
      acc: Math.round(pos.coords.accuracy || 0),
      t: Date.now(), tag, note: $("note").value.trim()
    };
    try {
      await store.add(rec);
      lastPos = rec;
      $("note").value = "";
      navigator.vibrate?.(30);
      toast("기록됨 · " + fmt(rec.t));
      if ((filterFrom || filterTo) && !inRange(dayKey(rec.t))) setRange(null, null);
      map.flyTo([rec.lat, rec.lng], Math.max(map.getZoom(), 16), { duration: .8 });
      setMe(rec.lat, rec.lng, rec.acc);
    } catch (e) {
      toast("저장 실패: " + (e.code || e.message));
    }
    done();
  }, err => {
    toast(err.code === 1 ? "위치 권한이 필요합니다. 브라우저 설정에서 허용해 주세요."
        : err.code === 3 ? "위치 확인 시간이 초과되었습니다. 다시 시도해 주세요."
        : "위치를 확인할 수 없습니다.");
    done();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});

/* ---------- 내 위치 찾기 (기록하지 않고 지도만 이동) ---------- */
$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) return toast("이 브라우저는 위치 기능을 지원하지 않습니다");
  if (!window.isSecureContext) return toast("위치 기능은 https 주소에서만 사용할 수 있습니다");
  const btn = $("locate"); btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos => {
    setMe(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    map.flyTo([pos.coords.latitude, pos.coords.longitude], Math.max(map.getZoom(), 16), { duration: .8 });
    btn.classList.remove("busy");
  }, err => {
    toast(err.code === 1 ? "위치 권한이 필요합니다. 브라우저 설정에서 허용해 주세요."
        : err.code === 3 ? "위치 확인 시간이 초과되었습니다. 다시 시도해 주세요."
        : "위치를 확인할 수 없습니다.");
    btn.classList.remove("busy");
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
});

/* ---------- 필터 / 재생 / 목록 ---------- */
const inRange = d => (!filterFrom || d >= filterFrom) && (!filterTo || d <= filterTo);
function setRange(from, to) {
  if (from && to && from > to) { const t = from; from = to; to = t; }
  filterFrom = from || null; filterTo = to || null;
  $("dFrom").value = filterFrom || ""; $("dTo").value = filterTo || "";
  const days = (filterFrom && filterTo) ? Math.round((new Date(filterTo) - new Date(filterFrom)) / 864e5) : -1;
  const today = dayKey(Date.now());
  [...$("presets").children].forEach(b => {
    const d = b.dataset.d;
    b.classList.toggle("on", d === "all" ? !filterFrom && !filterTo : filterTo === today && days === Number(d));
  });
  render(true);
}
$("dFrom").addEventListener("change", e => {
  const f = e.target.value || null;
  setRange(f, (f && filterTo && f > filterTo) ? f : filterTo);
});
$("dTo").addEventListener("change", e => {
  const t = e.target.value || null;
  setRange((t && filterFrom && t < filterFrom) ? t : filterFrom, t);
});
$("presets").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.d === "all") return setRange(null, null);
  const n = Number(b.dataset.d), now = Date.now();
  setRange(dayKey(now - n * 864e5), dayKey(now));
});
function setMin(min) {
  $("sheet").classList.toggle("min", min);
  $("grip").setAttribute("aria-expanded", String(!min));
  $("gripTxt").textContent = min ? "입력창 올리기 ▲" : "입력창 내리기 ▼";
  try { localStorage.setItem("sheet-min", min ? "1" : "0"); } catch (e) {}
  setTimeout(() => map.invalidateSize(), 320);
}
$("grip").addEventListener("click", () => setMin(!$("sheet").classList.contains("min")));
try { if (localStorage.getItem("sheet-min") === "1") setMin(true); } catch (e) {}

$("bList").onclick = () => {
  const open = $("sheet").classList.toggle("open");
  $("bList").textContent = open ? "목록 닫기" : "목록 보기";
};

$("bPlay").onclick = async () => {
  if (playing) { playing = false; return; }
  const vis = visible();
  if (!vis.length) return toast("재생할 기록이 없습니다");
  playing = true; $("bPlay").textContent = "정지";
  $("sheet").classList.remove("open"); $("bList").textContent = "목록 보기";
  for (const r of vis) {
    if (!playing) break;
    map.flyTo([r.lat, r.lng], 16, { duration: 1.1 });
    await new Promise(res => setTimeout(res, 1500));
    markerById.get(r.id)?.openPopup();
    await new Promise(res => setTimeout(res, 1300));
  }
  map.closePopup();
  playing = false; $("bPlay").textContent = "경로 재생";
  fitAll();
};

/* ---------- 자동 기록 (화면이 켜져 있는 동안) ---------- */
const DUP_M = 30;  /* 이전 기록과 이 거리(m) 안이면 저장하지 않음 */
let autoOn = false, autoTimer = null, wakeLock = null, lastAutoTs = 0, lastPos = null, busyAuto = false;

try {
  const v = localStorage.getItem("auto-min"), c = localStorage.getItem("auto-custom");
  if (v) $("aInt").value = v;
  if (c) $("aCustom").value = c;
} catch (e) {}
if (!$("aInt").value) $("aInt").value = "5";
const syncCustom = () => { $("aCustom").style.display = $("aInt").value === "custom" ? "block" : "none"; };
syncCustom();

const autoMin = () => {
  if ($("aInt").value === "custom") return Math.min(720, Math.max(1, Math.round(Number($("aCustom").value) || 10)));
  return Number($("aInt").value) || 5;
};
const hhmm = t => new Date(t).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
function autoStatus(txt) { const c = $("cAuto"); c.style.display = autoOn ? "inline-block" : "none"; c.textContent = txt; }
function latest() { let m = lastPos; for (const r of recs) if (!m || r.t > m.t) m = r; return m; }
async function takeWake() {
  try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } }
  catch (e) { /* 지원하지 않으면 화면 자동 잠금 설정에 따름 */ }
}

function autoOnce() {
  if (busyAuto) return;
  busyAuto = true;
  navigator.geolocation.getCurrentPosition(async pos => {
    const now = Date.now(); lastAutoTs = now;
    const here = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 0), t: now };
    setMe(here.lat, here.lng, here.acc);
    const prev = latest();
    const limit = Math.max(DUP_M, Math.min(here.acc, 100));
    if (prev && km(prev, here) * 1000 < limit) {
      autoStatus(`자동 ${autoMin()}분 · ${hhmm(now)} 이동 없음`);
    } else {
      try {
        await store.add({ lat: here.lat, lng: here.lng, acc: here.acc, t: now, tag: "일반", note: "자동" });
        lastPos = here;
        autoStatus(`자동 ${autoMin()}분 · ${hhmm(now)} 기록`);
      } catch (e) { autoStatus("자동 기록 저장 실패"); toast("저장 실패: " + (e.code || e.message)); }
    }
    busyAuto = false;
  }, err => {
    busyAuto = false;
    if (err.code === 1) { stopAuto(); toast("위치 권한이 필요합니다. 브라우저 설정에서 허용해 주세요."); return; }
    autoStatus(`자동 ${autoMin()}분 · 위치 확인 실패`);
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

function armTimer() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => { if (!document.hidden) autoOnce(); }, autoMin() * 60000);
}
async function startAuto() {
  if (!navigator.geolocation) return toast("이 브라우저는 위치 기능을 지원하지 않습니다");
  if (!window.isSecureContext) return toast("위치 기능은 https 주소에서만 사용할 수 있습니다");
  if ($("aInt").value === "custom" && !($("aCustom").value > 0)) return toast("간격(분)을 입력해 주세요");
  autoOn = true; $("aBtn").textContent = "자동 기록 중지"; $("aBtn").classList.add("on");
  autoStatus(`자동 ${autoMin()}분 · 시작`);
  await takeWake(); armTimer(); autoOnce();
}
function stopAuto() {
  autoOn = false; clearInterval(autoTimer);
  try { wakeLock && wakeLock.release(); } catch (e) {}
  wakeLock = null;
  $("aBtn").textContent = "자동 기록 시작"; $("aBtn").classList.remove("on");
  autoStatus("");
}
function intervalChanged() {
  try { localStorage.setItem("auto-min", $("aInt").value); localStorage.setItem("auto-custom", $("aCustom").value); } catch (e) {}
  syncCustom();
  if (autoOn) { armTimer(); autoStatus(`자동 ${autoMin()}분 · 간격 변경`); }
}
$("aBtn").addEventListener("click", () => { autoOn ? stopAuto() : startAuto(); });
$("aInt").addEventListener("change", intervalChanged);
$("aCustom").addEventListener("change", intervalChanged);
document.addEventListener("visibilitychange", async () => {
  if (!autoOn || document.hidden) return;
  await takeWake();
  if (Date.now() - lastAutoTs >= autoMin() * 60000) autoOnce();
});

/* ---------- 로그인 ---------- */
$("lUser").value = OWNER_EMAIL;
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!store.login) return;
  const btn = $("lBtn"); btn.disabled = true; $("loginErr").textContent = "";
  try { await store.login($("lPw").value); $("lPw").value = ""; }
  catch (err) {
    const c = err.code || "";
    $("loginErr").textContent =
      /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "비밀번호가 올바르지 않습니다."
      : /too-many-requests/.test(c) ? "시도가 너무 많습니다. 잠시 후 다시 시도하세요."
      : /operation-not-allowed/.test(c) ? "Firebase에서 이메일/비밀번호 로그인이 꺼져 있습니다."
      : "로그인 실패: " + (c || err.message);
  }
  btn.disabled = false;
});
$("logout").addEventListener("click", () => { if (store.logout && confirm("로그아웃할까요?")) store.logout(); });

/* ---------- 시작 ---------- */
store.watch(list => {
  recs = list;
  render(firstFit);
  if (list.length) firstFit = false;
});
})();
</script>
</body>
</html>
